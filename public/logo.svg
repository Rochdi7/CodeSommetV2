<svg width="200" height="150" viewBox="0 0 140 80" xmlns="http://www.w3.org/2000/svg">
  <path d="M 45 22 A 20 20 0 1 0 45 58" 
        fill="none" 
        stroke="#1A1A1B" 
        stroke-width="12" 
        stroke-linecap="round"
        stroke-dasharray="100"
        stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" fill="freeze" />
  </path>

  <path d="M 100 22 H 75 V 38" 
        fill="none" 
        stroke="#00AEEF" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="10 0" to="0 0" dur="0.6s" begin="0.5s" fill="freeze" />
    <animate attributeName="stroke" values="#00AEEF;#0071BC;#00AEEF" dur="3s" repeatCount="indefinite" />
  </path>

  <path d="M 75 58 H 100 V 42" 
        fill="none" 
        stroke="#0071BC" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" dur="0.6s" begin="0.8s" fill="freeze" />
    <animate attributeName="stroke" values="#0071BC;#00AEEF;#0071BC" dur="3s" repeatCount="indefinite" />
  </path>
</svg>
